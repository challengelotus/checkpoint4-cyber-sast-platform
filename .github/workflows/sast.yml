name: DevSecOps SAST Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  security-gate:
    name: 🛡️ Auditoria SAST & Security Gate
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout do código
        uses: actions/checkout@v4

      - name: 🐍 Configurar Python 3.11 com Cache
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 📦 Instalar dependências do SAST
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🛡️ Executar Security Gate Híbrido
        run: python scripts/security_gate.py | tee sast-report.txt

      - name: 📄 Upload do Relatório de Auditoria
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorio-sast-ci
          path: sast-report.txt
          retention-days: 15
